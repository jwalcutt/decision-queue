# Validation messages shown to the user. Each one names the field and says
# what to do about it. The default Rails messages cover the "can't be blank"
# cases; these override the ones that would otherwise leak column names or
# say "is not included in the list".

en:
  activerecord:
    attributes:
      decision:
        decision_type: Decision
    errors:
      models:
        request:
          attributes:
            urgency:
              inclusion: must be low, medium, or high
        decision:
          attributes:
            decision_type:
              blank: is missing. Choose accept, defer, or decline.
              inclusion: must be accept, defer, or decline
